schemaVersion: 2.2.0

metadata:
  name: cnpg-openshift-workshop
  version: 1.0.0

projects:
  - name: workshop
    git:
      remotes:
        origin: https://github.com/raphael-chir/cnpg-openshift-workshop.git
      checkoutFrom:
        revision: main

components:
  - name: tools
    container:
      image: quay.io/raphael_chir/cnpg-workshop-devspaces:1.1
      memoryLimit: 2Gi
      mountSources: true